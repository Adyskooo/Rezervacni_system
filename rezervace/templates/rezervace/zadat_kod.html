{% extends 'rezervace/base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3 text-center">
                    <h2 class="h4 mb-0 text-white"> Ověření kódu</h2>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="mb-4">Na e-mail <strong>{{ email }}</strong> jsme Vám zaslali ověřovací kód. Zadejte jej prosím níže.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-center">
                            <label for="{{ form.kod.id_for_label }}" class="form-label fw-bold d-block mb-3">Zadejte 6místný kód</label>
                            <div class="d-flex justify-content-center">
                                {{ form.kod }}
                            </div>
                            {% for error in form.kod.errors %}
                                <div class="text-danger small mt-2">{{ error }}</div>
                            {% endfor %}
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Ověřit kód</button>
                            <p class="mt-3 small text-muted">Nepřišel Vám e-mail? <a href="{% url 'zapomenute_heslo' %}" class="text-success">Zkuste to znovu</a>.</p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    input[name="kod"] { 
        font-size: 2rem;
        letter-spacing: 0.5rem;
        text-align: center;
        width: 100%;
        max-width: 200px;
        padding: 0.5rem;
        border: 2px solid #0068a3;
        border-radius: 0.5rem;
        font-weight: bold;
        color: #0068a3;
    }
    .form-label { color: #0068a3 !important; }
</style>
{% endblock %}
